# ============================== frontend nginx (внутри контейнера ff-frontend) ==========
# Раздаёт собранную SPA + healthz. Внешний reverse-proxy/TLS — nginx/nginx.conf на хосте.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Статика с кэшем (имена файлов содержат content-hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA: service worker и манифест не кэшируем агрессивно
    location ~* /(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
