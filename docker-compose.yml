version: '3.8'

services:
  backend:
    build: ./backend
    container_name: finance-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - DB_PATH=/app/data/finance.db
    volumes:
      - backend-data:/app/data
    networks:
      - finance-network

  frontend:
    build: ./frontend
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - finance-network

volumes:
  backend-data:

networks:
  finance-network:
    driver: bridge
