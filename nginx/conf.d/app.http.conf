# HTTP: редирект на HTTPS + webroot для Let's Encrypt (HTTP-01 challenge).
# До первого выпуска сертификата certbot'ом можно временно использовать этот
# сервер как основной (закомментируйте redirect), см. deploy.sh этап 10.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
