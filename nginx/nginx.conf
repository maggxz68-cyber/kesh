worker_processes auto;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65s;
    server_tokens      off;

    client_max_body_size 12m;   # загрузка чеков (лимит приложения — 10 МБ)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Rate limit на вход/демо-вход (уровень nginx, дополнительно к slowapi в backend)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    upstream ff_frontend { server frontend:80; }
    upstream ff_backend  { server backend:8000; }

    # HTTP-only сервер (без принудительного редиректа на HTTPS).
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://ff_backend;
        }

        location / {
            proxy_pass http://ff_frontend;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
