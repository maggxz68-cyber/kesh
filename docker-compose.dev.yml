version: '3.8'

# Docker Compose для разработки
# Запуск: docker-compose -f docker-compose.dev.yml up

services:
  # Backend сервер
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: family-budget-backend-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=dev-secret-key-not-for-production
    volumes:
      # Hot reload для серверного кода
      - ./server:/app
      - /app/node_modules
      # Persistent storage для базы данных
      - budget-data-dev:/app/data
    networks:
      - budget-dev-network

  # Frontend dev server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: family-budget-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    volumes:
      # Hot reload для фронтенда
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - budget-dev-network

volumes:
  budget-data-dev:
    driver: local

networks:
  budget-dev-network:
    driver: bridge
