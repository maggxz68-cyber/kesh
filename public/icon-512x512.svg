<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Shine effect -->
  <rect width="512" height="256" rx="96" fill="url(#shine)" opacity="0.3"/>
  <!-- Wallet icon -->
  <g transform="translate(256, 256)">
    <!-- Wallet body -->
    <rect x="-100" y="-60" width="200" height="140" rx="20" fill="white" opacity="0.95"/>
    <!-- Wallet flap -->
    <rect x="-100" y="-80" width="200" height="40" rx="20" fill="white" opacity="0.85"/>
    <!-- Card slot -->
    <rect x="-70" y="-20" width="140" height="8" rx="4" fill="#3b82f6" opacity="0.3"/>
    <!-- Coin/circle -->
    <circle cx="60" cy="20" r="30" fill="#fbbf24"/>
    <text x="60" y="30" font-size="30" text-anchor="middle" fill="#92400e" font-family="Arial" font-weight="bold">₽</text>
    <!-- Money lines -->
    <rect x="-70" y="10" width="80" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="-70" y="25" width="60" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="-70" y="40" width="90" height="6" rx="3" fill="#e5e7eb"/>
  </g>
  <!-- App name text -->
  <text x="256" y="440" font-size="42" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" opacity="0.9">ФинТрекер</text>
</svg>
