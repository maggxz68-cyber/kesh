[project]
name = "family-finance-backend"
version = "0.1.0"
description = "Family finance tracker backend (FastAPI + SQLAlchemy 2.0 + PostgreSQL)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "loguru>=0.7",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "Pillow>=10.4",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.10",
    "pyzbar>=0.1.9",
    "numpy>=1.26",
]
export = [
    "openpyxl>=3.1",
    "reportlab>=4.2",
]
prod = [
    "family-finance-backend[ocr,export]",
]
dev = [
    "family-finance-backend[prod]",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "mypy>=1.11",
    "ruff>=0.6",
    "black>=24.8",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
